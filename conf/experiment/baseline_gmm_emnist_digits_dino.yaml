# GMM Baseline on EMNIST Digits (DINOv2 features)
#
# Fits a Gaussian Mixture Model with prototype-initialized means.
# Fully unsupervised: no labels used during fitting.
#
# Usage:
#   conda activate mlresearch
#   PYTHONPATH=src python src/cli.py fit --config conf/experiment/baseline_gmm_emnist_digits_dino.yaml

seed_everything: 0

trainer:
  max_epochs: 1
  accelerator: auto
  devices: 1
  precision: 32
  log_every_n_steps: 1
  check_val_every_n_epoch: 1
  logger:
    class_path: lightning.pytorch.loggers.MLFlowLogger
    init_args:
      experiment_name: "Baseline_GMM_EMNIST_Digits_DINO"
      tracking_uri: "http://localhost:8090"
      log_model: false

model:
  class_path: baseline.BaselineTask.GMMTask
  init_args:
    num_classes: 10
    feature_dim: 384  # DINOv2 ViT-S/14
    prototypes_per_class: 3
    prototype_selection: "random"
    covariance_type: "diag"
    max_iter: 200

data:
  class_path: data.CachedFeatureDatamodule.CachedFeatureDatamodule
  init_args:
    cache_dir: "/data/thallybu/cache"
    dataset_name: "emnist_digits_dinov2_vits14"
    batch_size: 1024
    num_workers: 4
