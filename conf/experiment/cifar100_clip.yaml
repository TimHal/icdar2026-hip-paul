# CIFAR-100 with CLIP ViT-B/32 features (512-dim)
#
# Usage:
#   conda activate mlresearch
#   PYTHONPATH=src python src/cli.py fit --config conf/experiment/cifar100_clip.yaml

seed_everything: 42

trainer:
  max_epochs: 20
  accelerator: auto
  devices: 1
  precision: 32
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  callbacks:
    - class_path: core.callbacks.EnableSystemMetricsCallback.EnableSystemMetricsCallback
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: "val/loss"
        min_delta: 0.005
        patience: 5
        mode: "min"
        verbose: true
  logger:
    class_path: lightning.pytorch.loggers.MLFlowLogger
    init_args:
      experiment_name: "ClasswiseAE_CIFAR100_CLIP"
      tracking_uri: "http://localhost:8090"
      log_model: true

model:
  class_path: task.ClasswiseAETask
  init_args:
    num_classes: 100
    feature_dim: 512  # CLIP ViT-B/32 output dimension
    n_components: 10
    hidden_dims: [256]
    dropout: 0.01
    l2_reg: 1e-6
    learning_rate: 0.001
    umap_loss_weight: 0.05
    use_umap_loss: true
    umap_n_neighbors: 15
    umap_min_dist: 0.1

data:
  class_path: data.CachedFeatureDatamodule
  init_args:
    cache_dir: "/data/thallybu/cache"
    dataset_name: "cifar100_vit-b-32_openai"
    batch_size: 64
    num_workers: 4
    seed: 42
    train_val_split: [0.9, 0.1]
