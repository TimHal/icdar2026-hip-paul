# Multi-view MAE training on Omniglot for feature extraction
#
# Omniglot contains 1623 handwritten characters from 50 alphabets.
# Background set (training): 30 alphabets, 964 characters, ~19K images
# Evaluation set (validation): 20 alphabets, 659 characters, ~13K images
#
# The learned encoder can be used as a feature extractor for downstream
# tasks like classwise autoencoder training.
#
# Usage:
#   conda activate mlresearch
#   PYTHONPATH=src python src/cli.py fit --config conf/experiment/mae_omniglot_multiview.yaml
#
# Feature extraction after training:
#   from feature_extractors import MAEFeatureExtractor
#   extractor = MAEFeatureExtractor.from_checkpoint("path/to/checkpoint.ckpt")
#   features = extractor.extract(images)

seed_everything: 42

trainer:
  max_epochs: 100  # More epochs for smaller dataset
  accelerator: auto
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 50
  check_val_every_n_epoch: 5
  gradient_clip_val: 1.0
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: "val/loss"
        mode: "min"
        save_top_k: 1
        save_last: true
        filename: "omniglot_mae_multiview_{epoch:03d}_{val/loss:.4f}"
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: "val/loss"
        patience: 10
        mode: "min"
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: "step"
  logger:
    class_path: lightning.pytorch.loggers.MLFlowLogger
    init_args:
      experiment_name: "MAE_Omniglot_MultiView"
      tracking_uri: "http://localhost:8090"
      log_model: true

model:
  class_path: task.MAETask.MAETask
  init_args:
    learning_rate: 1e-3  # Slightly higher LR for smaller dataset
    weight_decay: 0.05
    warmup_epochs: 2  # Longer warmup relative to epochs
    min_lr: 1.0e-6
    log_reconstruction_every: 1000
    mask_ratio: 0.65  # Standard MAE masking ratio
    model:
      class_path: mae.multiview_mae.MultiViewMAE
      init_args:
        share_masking: false  # Independent masking per view for diversity
        base_mae:
          class_path: mae.mae_model.MaskedAutoencoder
          init_args:
            # Image settings - Omniglot is 105x105, resize to 112 for better patches
            img_size: 224
            patch_size: 14  # 112/14 = 8x8 = 64 patches
            in_chans: 1

            # Encoder - moderate size for ~19K images
            embed_dim: 256
            encoder_depth: 4
            encoder_heads: 2

            # Decoder - lightweight
            decoder_embed_dim: 128
            decoder_depth: 2
            decoder_heads: 2

            # Training
            mlp_ratio: 4.0
            norm_pix_loss: false  # Often helps with grayscale
            use_cls_token: true
            drop_rate: 0.0
            attn_drop_rate: 0.0

data:
  class_path: data.MultiViewDatamodule.MultiViewDatamodule
  init_args:
    dataset_name: "Omniglot"
    root_dir: "/data/thallybu/datasets/Omniglot"
    download: false  # Use existing dataset
    img_size: 224
    num_views: 2
    batch_size: 32  # Smaller batch for limited GPU memory
    num_workers: 4
    persistent_workers: true
    pin_memory: true
    # Augmentations tuned for handwritten characters
    augmentation_config:
      rotation_range: 20.0  # Omniglot benefits from more rotation
      translate_range: 0.15
      scale_range: [0.85, 1.15]
      blur_sigma: [0.1, 1.5]
      blur_prob: 0.3
      noise_std: 0.03
      noise_prob: 0.2
      brightness_range: 0.15
      contrast_range: 0.15
