# MNIST with CLIP ViT-L/14 features (paper default)
# Hyperparameters aligned with Marks et al. 2024 paper
#
# Note: Paper uses clip-vit-large-patch14 (768-dim) as default.
# Use ViT-B/32 (512-dim) for faster experiments.
#
# Usage:
#   conda activate mlresearch
#   PYTHONPATH=src python src/cli.py fit --config conf/experiment/mnist_clip_simple.yaml

seed_everything: 42

trainer:
  max_epochs: 20  # Paper default (with early stopping)
  accelerator: auto
  devices: 1
  precision: 32
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: "val/loss"
        min_delta: 0.005  # Paper: 5e-3
        patience: 5       # Paper default
        mode: "min"
        verbose: true
  logger:
    class_path: lightning.pytorch.loggers.MLFlowLogger
    init_args:
      experiment_name: "ClasswiseAE_MNIST_MAE"
      tracking_uri: "http://localhost:8090"
      log_model: true

model:
  class_path: task.ClasswiseAETask
  init_args:
    num_classes: 10
    feature_dim: 128       # CLIP ViT-L/14 (paper default); use 512 for ViT-B/32
    n_components: 10       # Paper default
    hidden_dims: [256]     # Paper default
    dropout: 0.01          # Paper default
    l2_reg: 1e-6           # Paper default
    learning_rate: 0.001     # Paper default (was 0.001)
    umap_loss_weight: 0.05 # Paper: 20:1 MSE:UMAP ratio
    use_umap_loss: true
    umap_n_neighbors: 15   # Paper default (was 15)
    umap_min_dist: 0.1

data:
  class_path: data.CachedFeatureDatamodule
  init_args:
    cache_dir: "/data/thallybu/cache"
    dataset_name: "emnist_digits_mae_vit_128d_2l_224px"  # Paper default; use mnist_clip_vitb32 for ViT-B/32
    batch_size: 64
    num_workers: 4
    seed: 42
    train_val_split: [0.9, 0.1]
