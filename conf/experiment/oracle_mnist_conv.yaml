# Oracle-MNIST with Shallow Convolutional Autoencoder (raw pixels, supervised)
#
# Uses raw 28x28 grayscale images flattened to 784-dim vectors.
# Trains K=10 shallow convolutional autoencoders (one per class).
#
# Expects Oracle-MNIST data in MNIST binary format at:
#   /data/thallybu/datasets/OracleMNIST/raw/
#
# Usage:
#   conda activate mlresearch
#   PYTHONPATH=src python src/cli.py fit --config conf/experiment/oracle_mnist_conv.yaml

seed_everything: 42

trainer:
  max_epochs: 50
  accelerator: auto
  devices: 1
  precision: 32
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  gradient_clip_val: 1.0
  callbacks:
    - class_path: core.callbacks.EnableSystemMetricsCallback.EnableSystemMetricsCallback
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        min_delta: 0.0001
        patience: 10
        mode: min
        verbose: true
  logger:
    class_path: lightning.pytorch.loggers.MLFlowLogger
    init_args:
      experiment_name: ClasswiseAE_OracleMNIST_Conv
      tracking_uri: http://localhost:8090
      log_model: true

model:
  class_path: task.ClasswiseAETask
  init_args:
    num_classes: 10
    feature_dim: 784  # 28*28*1 for grayscale Oracle-MNIST
    n_components: 16
    dropout: 0.01
    l2_reg: 1.0e-6
    learning_rate: 0.001
    use_umap_loss: false

    # Pruning settings
    enable_pruning: true
    pruning_mode: threshold
    prune_threshold: 1.2

    # Prototype settings
    auto_select_prototypes: true
    prototypes_per_class: 3
    prototype_selection: random

    autoencoder_class: ShallowConvAutoencoder
    autoencoder_kwargs:
      image_shape:
        - 1
        - 28
        - 28
      conv_channels:
        - 8
        - 16

data:
  class_path: data.TorchvisionDatamodule
  init_args:
    dataset_name: OracleMNIST
    root_dir: /data/thallybu/datasets
    img_mode: L
    batch_size: 1024
    num_workers: 4
    seed: 42
    train_val_split:
      - 0.9
      - 0.1
    flatten: true
    raw_pixels: true
