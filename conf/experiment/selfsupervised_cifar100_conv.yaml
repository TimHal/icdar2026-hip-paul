# Self-Supervised CIFAR-100 with Shallow Convolutional Autoencoder (raw pixels)
#
# Uses raw 32x32 RGB images flattened to 3072-dim vectors.
# Trains K=100 shallow convolutional autoencoders with prototype-guided assignment.
# True labels are only used for validation metrics.
#
# Usage:
#   conda activate mlresearch
#   PYTHONPATH=src python src/cli.py fit --config conf/experiment/selfsupervised_cifar100_conv.yaml

seed_everything: 42

trainer:
  max_epochs: 25
  accelerator: auto
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  gradient_clip_val: 1.0
  callbacks:
    - class_path: core.callbacks.EnableSystemMetricsCallback.EnableSystemMetricsCallback
  logger:
    class_path: lightning.pytorch.loggers.MLFlowLogger
    init_args:
      experiment_name: SelfSupervised_CIFAR100_Conv
      tracking_uri: http://localhost:8090
      log_model: true

model:
  class_path: task.SelfSupervisedAETask.SelfSupervisedAETask
  init_args:
    num_classes: 100
    feature_dim: 3072  # 32*32*3 for RGB CIFAR-100
    n_components: 32
    dropout: 0.01
    l2_reg: 1.0e-6
    prototype_img_mode: RGB

    # Assignment settings
    rer_threshold: 1.0
    top_n_per_class: 10
    min_samples_for_training: 5

    # Epoch-based assignment strategy
    assignment_mode: fixed_k
    assignments_per_epoch: 25
    assignment_threshold: 0.8

    # Pruning settings
    enable_pruning: true
    pruning_mode: fixed_k
    prune_threshold: 1.2

    # Prototype settings
    auto_select_prototypes: true
    prototypes_per_class: 5
    prototype_selection: random

    # Training settings
    learning_rate: 0.001
    warmup_epochs: 0

    # Loss settings
    use_prototype_anchoring: true
    prototype_anchor_weight: 0.3
    use_umap_loss: false

    # Convolutional autoencoder
    autoencoder_class: ShallowConvAutoencoder
    autoencoder_kwargs:
      image_shape:
        - 3
        - 32
        - 32
      conv_channels:
        - 8
        - 16
        - 16

data:
  class_path: data.TorchvisionDatamodule
  init_args:
    dataset_name: CIFAR100
    root_dir: /data/thallybu/datasets
    img_mode: RGB
    batch_size: 2048
    num_workers: 4
    seed: 42
    train_val_split:
      - 0.9
      - 0.1
    flatten: true
    raw_pixels: true
    pin_memory: false
