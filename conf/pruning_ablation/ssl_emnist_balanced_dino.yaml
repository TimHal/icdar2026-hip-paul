seed_everything: 42
trainer:
  max_epochs: 75
  accelerator: auto
  devices: 1
  precision: 16
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  gradient_clip_val: 1.0
  callbacks:
  - class_path: core.callbacks.EnableSystemMetricsCallback.EnableSystemMetricsCallback
  logger:
    class_path: lightning.pytorch.loggers.MLFlowLogger
    init_args:
      experiment_name: SelfSupervised_EMNIST_Balanced_Dino
      tracking_uri: http://localhost:8090
      log_model: true
model:
  class_path: task.SelfSupervisedAETask.SelfSupervisedAETask
  init_args:
    num_classes: 47
    feature_dim: 384
    n_components: 30
    dropout: 0.059975025046032096
    l2_reg: 1.0e-06
    hidden_dims:
    - 128
    rer_threshold: 1.0
    top_n_per_class: 10
    min_samples_for_training: 5
    assignment_mode: fixed_k
    assignment_threshold: 0.7831888125313664
    assignments_per_epoch: 100
    enable_pruning: true
    pruning_mode: threshold
    prune_threshold: 1.304162953363601
    prune_per_epoch: 50
    auto_select_prototypes: true
    prototypes_per_class: 5
    prototype_selection: random
    learning_rate: 0.0005115342422899574
    warmup_epochs: 1
    use_prototype_anchoring: true
    prototype_anchor_weight: 0.29080514958518033
    use_umap_loss: false
data:
  class_path: data.CachedFeatureDatamodule
  init_args:
    cache_dir: /data/thallybu/cache
    dataset_name: emnist_balanced_dinov2_vits14
    batch_size: 2048
    num_workers: 4
    seed: 42
    train_val_split:
    - 0.9
    - 0.1
