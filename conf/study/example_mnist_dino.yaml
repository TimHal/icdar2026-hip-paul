# Optuna study config for MNIST + DINOv2 experiment
#
# Usage:
#   conda activate mlresearch
#   PYTHONPATH=src python src/cli.py study \
#     --config conf/experiment/mnist_dino_simple.yaml \
#     --study_config conf/study/example_mnist_dino.yaml

study:
  name: "mnist_dino_hpo"
  direction: minimize         # minimize or maximize
  metric: "val/loss"           # metric from trainer.callback_metrics
  n_trials: 30
  storage_dir: "./sweeps"      # Journal file written to ./sweeps/<name>.journal; shared across workers
  sampler: TPESampler          # TPESampler, RandomSampler, CmaEsSampler
  pruner:
    type: MedianPruner
    n_startup_trials: 5        # complete this many trials before pruning
    n_warmup_steps: 5          # epochs before pruning within a trial
  # Optional early stopping per trial
  early_stopping:
    patience: 5

# Search space: each key is a dot-path into the base experiment config
# Supported types: float, int, categorical
search_space:
  model.init_args.learning_rate:
    type: float
    low: 1e-5
    high: 1e-2
    log: true

  model.init_args.n_components:
    type: int
    low: 5
    high: 50

  model.init_args.hidden_dims:
    type: categorical
    choices:
      - [8]
      - [16]
      - [128]
      - [128, 64]
      - [256, 128]

  model.init_args.dropout:
    type: float
    low: 0.0
    high: 0.3

  model.init_args.umap_loss_weight:
    type: float
    low: 0.01
    high: 0.2
