# Multi-objective Optuna study for MNIST + DINOv2
#
# Optimises val/loss AND val/chi simultaneously. The result is a Pareto front
# of trials that trade off reconstruction quality vs class separability.
#
# Usage:
#   conda activate mlresearch
#   PYTHONPATH=src python src/cli.py study \
#     --config conf/experiment/mnist_dino_simple.yaml \
#     --study_config conf/study/example_mnist_dino_multiobjective.yaml

study:
  name: "mnist_dino_multiobjective"
  directions: [minimize, minimize]     # one per metric
  metrics: ["val/loss", "val/chi"]     # one per direction
  n_trials: 40
  storage_dir: "./sweeps"
  sampler: NSGAIISampler               # NSGA-II is designed for multi-objective
  pruner:
    type: NopPruner                    # pruning is tricky with multi-objective; disable
  early_stopping:
    patience: 5

search_space:
  model.init_args.learning_rate:
    type: float
    low: 1e-5
    high: 1e-2
    log: true

  model.init_args.n_components:
    type: int
    low: 5
    high: 50

  model.init_args.hidden_dims:
    type: categorical
    choices:
      - [128]
      - [256]
      - [512]
      - [256, 128]

  model.init_args.dropout:
    type: float
    low: 0.0
    high: 0.3

  model.init_args.umap_loss_weight:
    type: float
    low: 0.01
    high: 0.2
