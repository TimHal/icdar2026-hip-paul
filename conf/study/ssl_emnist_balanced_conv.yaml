# Optuna study for Self-Supervised EMNIST Balanced with Convolutional AE
#
# Covers all params from the grid sweep (tools/ssl_emnist_balanced_conv.yaml)
# plus additional hyperparameters for broader exploration.
#
# Usage:
#   conda activate mlresearch
#   PYTHONPATH=src python src/cli.py study \
#     --config conf/experiment/selfsupervised_emnist_balanced_conv.yaml \
#     --study_config conf/study/ssl_emnist_balanced_conv.yaml

study:
  name: "ssl_emnist_balanced_conv"
  directions: [maximize]     # one per metric
  metrics: ["val/accuracy"]     # one per direction direction: minimize
  storage_dir: "./sweeps"
  sampler: TPESampler
  n_trials: 40
  pruner:
    type: MedianPruner
    n_startup_trials: 8
    n_warmup_steps: 8
  early_stopping:
    patience: 10

# ---------------------------------------------------------------------------
# Search space
# ---------------------------------------------------------------------------
# Params from the original grid sweep are marked [sweep].
# Additional params are marked [extra].

search_space:

  # ---- Architecture [sweep] ----
  model.init_args.autoencoder_kwargs.conv_channels:
    type: categorical
    choices:
      - [4]
      - [8]
      - [8, 16]
      - [16, 32]

  model.init_args.n_components:
    type: int
    low: 4
    high: 32

  # ---- Optimiser [sweep + extra] ----
  model.init_args.learning_rate:
    type: float
    low: 5.0e-5
    high: 5.0e-3
    log: true

  # ---- Assignment strategy [sweep] ----
  model.init_args.assignment_mode:
    type: categorical
    choices:
      - fixed_k
      - threshold

  model.init_args.pruning_mode:
    type: categorical
    choices:
      - fixed_k
      - threshold

  # fixed_k params (only suggested when assignment_mode=fixed_k)
  model.init_args.assignments_per_epoch:
    type: categorical
    choices: [50, 100, 250, 500]

  model.init_args.prune_per_epoch:
    type: categorical
    choices: [25, 50, 100]

  # threshold params (only suggested when assignment_mode=threshold)
  model.init_args.assignment_threshold:
    type: float
    low: 0.4
    high: 0.9

  model.init_args.prune_threshold:
    type: float
    low: 1.1
    high: 1.6

  # ---- Regularisation [extra] ----
  model.init_args.dropout:
    type: float
    low: 0.0
    high: 0.15

  model.init_args.prototype_anchor_weight:
    type: float
    low: 0.05
    high: 0.5

  # ---- Training schedule [extra] ----
  model.init_args.warmup_epochs:
    type: int
    low: 1
    high: 5

  model.init_args.prototypes_per_class:
    type: int
    low: 1
    high: 5

conditions:
  model.init_args.assignments_per_epoch:
    when: model.init_args.assignment_mode
    equals: fixed_k
  model.init_args.prune_per_epoch:
    when: model.init_args.pruning_mode
    equals: fixed_k
  model.init_args.assignment_threshold:
    when: model.init_args.assignment_mode
    equals: threshold
  model.init_args.prune_threshold:
    when: model.init_args.pruning_mode
    equals: threshold
