# Optuna study config for STL-10 + CLIP
#
# Usage:
#   conda activate mlresearch
#   PYTHONPATH=src python src/cli.py study \
#     --config conf/experiment/stl10_clip.yaml \
#     --study_config conf/study/stl10_clip.yaml

study:
  name: "stl10_clip_hpo"
  direction: minimize
  metric: "val/loss"
  n_trials: 30
  storage_dir: "./sweeps"
  sampler: TPESampler
  pruner:
    type: MedianPruner
    n_startup_trials: 5
    n_warmup_steps: 5
  early_stopping:
    patience: 5

search_space:
  model.init_args.learning_rate:
    type: float
    low: 1e-5
    high: 1e-2
    log: true

  model.init_args.n_components:
    type: int
    low: 5
    high: 50

  model.init_args.hidden_dims:
    type: categorical
    choices:
      - [8]
      - [16]
      - [128]
      - [128, 64]
      - [256, 128]

  model.init_args.dropout:
    type: float
    low: 0.0
    high: 0.3

  model.init_args.umap_loss_weight:
    type: float
    low: 0.01
    high: 0.2
