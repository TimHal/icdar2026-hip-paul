seed_everything: 42
trainer:
  max_epochs: 100
  accelerator: auto
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 20
  check_val_every_n_epoch: 1
  gradient_clip_val: 1.0
  callbacks:
  - class_path: core.callbacks.EnableSystemMetricsCallback.EnableSystemMetricsCallback
  logger:
    class_path: lightning.pytorch.loggers.MLFlowLogger
    init_args:
      experiment_name: SelfSupervised_OMNIGLOT20_DINO
      tracking_uri: http://localhost:8090
      log_model: true
model:
  class_path: task.SelfSupervisedAETask.SelfSupervisedAETask
  init_args:
    num_classes: 20
    feature_dim: 384
    n_components: 6
    hidden_dims:
    - 128
    - 64
    dropout: 0.07767534023783887
    l2_reg: 1.0e-06
    rer_threshold: 1.0
    top_n_per_class: 10
    min_samples_for_training: 3
    assignment_mode: fixed_k
    assignments_per_epoch: 100
    assignment_threshold: 0.9
    enable_pruning: true
    pruning_mode: threshold
    prune_per_epoch: 50
    prune_threshold: 1.4226496719110535
    auto_select_prototypes: true
    prototypes_per_class: 3
    prototype_selection: random
    learning_rate: 0.0024239533306781294
    warmup_epochs: 2
    use_prototype_anchoring: true
    prototype_anchor_weight: 0.14019602733934852
    use_umap_loss: true
    umap_loss_weight: 0.07579215753312023
data:
  class_path: data.CachedFeatureDatamodule.CachedFeatureDatamodule
  init_args:
    cache_dir: /data/thallybu/cache
    dataset_name: omniglot20_dinov2_vits14
    batch_size: 1024
    num_workers: 4
    seed: 42
    train_val_split:
    - 0.9
    - 0.1
