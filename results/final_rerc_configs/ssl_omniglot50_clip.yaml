seed_everything: 42
trainer:
  max_epochs: 100
  accelerator: auto
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 20
  check_val_every_n_epoch: 1
  gradient_clip_val: 1.0
  callbacks:
  - class_path: core.callbacks.EnableSystemMetricsCallback.EnableSystemMetricsCallback
  logger:
    class_path: lightning.pytorch.loggers.MLFlowLogger
    init_args:
      experiment_name: SelfSupervised_OMNIGLOT50_CLIP
      tracking_uri: http://localhost:8090
      log_model: true
model:
  class_path: task.SelfSupervisedAETask.SelfSupervisedAETask
  init_args:
    num_classes: 50
    feature_dim: 512
    n_components: 28
    hidden_dims:
    - 128
    - 64
    dropout: 0.01803883156736556
    l2_reg: 1.0e-06
    rer_threshold: 1.0
    top_n_per_class: 10
    min_samples_for_training: 3
    assignment_mode: threshold
    assignments_per_epoch: 250
    assignment_threshold: 0.7507165650185095
    enable_pruning: true
    pruning_mode: threshold
    prune_per_epoch: 50
    prune_threshold: 1.1285786493467984
    auto_select_prototypes: true
    prototypes_per_class: 5
    prototype_selection: random
    learning_rate: 0.0011219651940758658
    warmup_epochs: 1
    use_prototype_anchoring: true
    prototype_anchor_weight: 0.2275421211413257
    use_umap_loss: true
    umap_loss_weight: 0.011074635939196085
data:
  class_path: data.CachedFeatureDatamodule.CachedFeatureDatamodule
  init_args:
    cache_dir: /data/thallybu/cache
    dataset_name: omniglot50_vit-b-32_openai
    batch_size: 1024
    num_workers: 4
    seed: 42
    train_val_split:
    - 0.9
    - 0.1
