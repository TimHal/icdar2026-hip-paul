output_dir: ./sweeps/singleview_mae

params:
  - model.init_args.model.init_args.norm_pix_loss: [true, false]
  - model.init_args.model.init_args.use_cls_token: [true, false]
  - model.init_args.mask_ratio: [0.65, 0.75, 0.85]

groups:
  - - model.init_args.model.init_args.embed_dim: 128
      model.init_args.model.init_args.encoder_depth: 2
      model.init_args.model.init_args.encoder_heads: 2
    - model.init_args.model.init_args.embed_dim: 256
      model.init_args.model.init_args.encoder_depth: 4
      model.init_args.model.init_args.encoder_heads: 2
    - model.init_args.model.init_args.embed_dim: 512
      model.init_args.model.init_args.encoder_depth: 6
      model.init_args.model.init_args.encoder_heads: 4