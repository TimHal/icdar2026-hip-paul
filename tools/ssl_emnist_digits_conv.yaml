output_dir: ./sweeps/ssl_emnist_digits_conv

params:
  - model.init_args.autoencoder_kwargs.conv_channels: [[8], [8, 16], [16, 32]]
  - model.init_args.learning_rate: [0.0001, 0.001]
  - model.init_args.use_prototype_anchoring: [true, false]
  - model.init_args.n_components: [4, 16, 32]

groups:
  - - model.init_args.assignment_mode: "fixed_k"
      model.init_args.assignments_per_epoch: 100
      model.init_args.pruning_mode: "fixed_k"
      model.init_args.prune_per_epoch: 25
    - model.init_args.assignment_mode: "fixed_k"
      model.init_args.assignments_per_epoch: 500
      model.init_args.pruning_mode: "fixed_k"
      model.init_args.prune_per_epoch: 100
    - model.init_args.assignment_mode: "threshold"
      model.init_args.assignment_threshold: 0.6
      model.init_args.pruning_mode: "threshold"
      model.init_args.prune_threshold: 1.4
    - model.init_args.assignment_mode: "threshold"
      model.init_args.assignment_threshold: 0.8
      model.init_args.pruning_mode: "threshold"
      model.init_args.prune_threshold: 1.2
