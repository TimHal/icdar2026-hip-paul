output_dir: ./sweeps/ssl_emnist_mini

params:
  - model.init_args.hidden_dims: [[16], [32], [64]]
  - model.init_args.learning_rate: [0.0005, 0.0001, 0.001]

groups:
  - - model.init_args.assignment_mode: "fixed_k"
      model.init_args.assignments_per_epoch: 100
      model.init_args.pruning_mode: "fixed_k"
      model.init_args.prune_per_epoch: 25
    - model.init_args.assignment_mode: "fixed_k"
      model.init_args.assignments_per_epoch: 50
      model.init_args.pruning_mode: "fixed_k"
      model.init_args.prune_per_epoch: 15
    - model.init_args.assignment_mode: "fixed_k"
      model.init_args.assignments_per_epoch: 200
      model.init_args.pruning_mode: "fixed_k"
      model.init_args.prune_per_epoch: 75
    - model.init_args.assignment_mode: "threshold"
      model.init_args.assignment_threshold: 0.6
      model.init_args.pruning_mode: "threshold"
      model.init_args.prune_threshold: 1.1
    - model.init_args.assignment_mode: "threshold"
      model.init_args.assignment_threshold: 0.8
      model.init_args.pruning_mode: "threshold"
      model.init_args.prune_threshold: 1.2
  - - data.init_args.dataset_name: "emnist_balanced_mae_vit_256d_4l_224px"
      model.init_args.feature_dim: 256
    - data.init_args.dataset_name: "emnist_balanced_dinov2_vits14"
      model.init_args.feature_dim: 384
    - data.init_args.dataset_name: "emnist_balanced_vit-b-32_openai"
      model.init_args.feature_dim: 512
